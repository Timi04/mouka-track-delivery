<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'none'; object-src 'none'; frame-src https://www.openstreetmap.org; base-uri 'none'; form-action 'none'">
<title>Mouka Driver | Browser preview</title>
<meta name="description" content="Try the Mouka Driver trip and delivery workflow with sample assignments.">
<link rel="icon" href="mouka.svg" type="image/svg+xml">
<link rel="stylesheet" href="driver.css">
<link rel="stylesheet" href="workspace.css">
<script defer src="preview.js"></script>
<script defer src="driver.js"></script>
<script defer src="workspace.js"></script>
<script type="module" src="workspace-entry.js"></script>
</head>
<body>
<div id="driverWorkspace" class="workspace" hidden>
<button id="navScrim" type="button" class="nav-scrim" aria-label="Close navigation" hidden></button>
<aside id="driverSidebar" class="driver-sidebar" aria-label="Driver workspace navigation">
  <div class="side-brand"><img src="mouka.svg" alt="Mouka"><div><strong>Mouka Driver</strong><small>Delivery workspace</small></div><button id="navClose" type="button" class="plain-icon" aria-label="Close navigation"></button></div>
  <nav id="driverNav" aria-label="Driver workspace"></nav>
  <div class="side-account">
    <div id="driverSettings" class="settings-panel" hidden>
      <strong>Appearance</strong>
      <div id="appearanceOptions" class="theme-options" role="group" aria-label="Appearance"></div>
      <label for="driverFont">Font size</label>
      <select id="driverFont"><option value="compact">Compact</option><option value="standard">Standard</option><option value="large">Large</option></select>
      <div id="driverSettingsLinks" class="settings-links"></div>
      <button type="button" id="signOut" class="side-link">Sign out</button>
    </div>
    <button id="accountSettings" type="button" aria-expanded="false" aria-controls="driverSettings">
      <span id="sidebarInitials" class="driver-avatar">AD</span><span class="side-identity"><strong>Account settings</strong><small id="sidebarDriver">Driver account</small></span>
      <span id="accountChevron" aria-hidden="true"></span>
    </button>
  </div>
</aside>
<div class="workspace-body">
  <header class="workspace-top">
    <button id="navToggle" type="button" class="plain-icon" aria-controls="driverSidebar" aria-expanded="false" aria-label="Open navigation"></button>
    <span id="workspaceCrumb">Dispatch Overview</span>
    <span class="preview">Browser demo</span>
  </header>
  <main class="workspace-main"><div id="screen"><p>Loading trips…</p></div></main>
</div>
<footer id="dock" hidden></footer>
<dialog id="confirm">
  <h2 id="confirmTitle"></h2><p id="confirmText"></p>
  <div class="dialogActions"><button id="cancel" class="secondary">Cancel</button><button id="approve" class="primary"></button></div>
</dialog>
<p id="notice" role="status" aria-live="polite" hidden></p>
</div>
</body>
</html>
